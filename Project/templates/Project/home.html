{%extends "base.html"%} {% load static %} {% block content %}

<h1>What are you reading</h1>
<img
  src="{% static 'project/image/hero-books.jpg' %}"
  alt="A line of books with their spines facing to the sky"
/>
<p>This is the home page for "A Book Site"!</p>

<section class="card">
  {%for book in books%}
  <h2><a href="{{book.get_absolute_url}}">{{book.title}}</a></h2>
  <p>{{book.author}}</p>
  <p>Pages: {{book.page_num}}</p>
  <p>DDs: {{book.dds}}</p>
  {%endfor%}
</section>

{% endblock %}
