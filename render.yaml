databases:
  - name: finaldb
    plan: free
    databaseName: final
    user: final

services:
  - type: web
    plan: free
    name: final
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "python -m gunicorn final.asgi:application -k uvicorn.workers.UvicornWorker"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finaldb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
